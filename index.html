<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarView 🌌🪐 - Interactive Solar System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./images/earth.png">
</head>
<body>
  <!-- Header Bar -->
  <header class="top-nav">
    <div class="brand">
      <span class="logo">🌌 SolarView</span>
      <span class="badge">Live Web Edition</span>
    </div>
    <div class="controls">
      <button id="pause-btn" class="ctrl-btn" title="Pause or Resume Orbit Animations">⏸️ Pause</button>
      <div class="speed-container">
        <label for="speed-slider">Speed: <span id="speed-label">1.0x</span></label>
        <input type="range" id="speed-slider" min="0.2" max="4.0" step="0.2" value="1.0">
      </div>
      <button id="zoom-in" class="ctrl-btn zoom-btn" title="Zoom In">+</button>
      <button id="zoom-out" class="ctrl-btn zoom-btn" title="Zoom Out">−</button>
      <button id="zoom-reset" class="ctrl-btn" title="Reset Zoom">Reset</button>
    </div>
    <div class="actions">
      <a href="https://github.com/durgesh0314/solar-system" target="_blank" rel="noopener" class="gh-link">
        🐍 Python App & Source Code
      </a>
    </div>
  </header>

  <!-- Solar System Simulation Stage -->
  <main id="stage">
    <div class="container" id="solar-container">
      <div class="sun planet-node" data-planet="sun" title="The Sun">
        <img src="./images/sun.png" alt="Sun">
      </div>
      <div class="mercury planet-node" data-planet="mercury" title="Mercury"></div>
      <div class="venus planet-node" data-planet="venus" title="Venus"></div>
      <div class="earth planet-node" data-planet="earth" title="Earth">
        <div class="moon planet-node" data-planet="moon" title="The Moon"></div>
      </div>
      <div class="mars planet-node" data-planet="mars" title="Mars"></div>
      <div class="jupiter planet-node" data-planet="jupiter" title="Jupiter"></div>
      <div class="saturn planet-node" data-planet="saturn" title="Saturn"></div>
      <div class="uranus planet-node" data-planet="uranus" title="Uranus"></div>
      <div class="neptune planet-node" data-planet="neptune" title="Neptune"></div>
      <div class="pluto planet-node" data-planet="pluto" title="Pluto"></div>
    </div>
  </main>

  <!-- Interactive Info Card Panel -->
  <aside id="info-modal" class="info-card hidden">
    <div class="card-header">
      <div>
        <h3 id="card-name">Earth</h3>
        <p id="card-type">Terrestrial Planet</p>
      </div>
      <button id="close-card" class="close-btn">&times;</button>
    </div>
    <hr>
    <div class="card-body" id="card-details">
      <!-- Injected via JavaScript -->
    </div>
  </aside>

  <!-- Quick Selection Navigation Ribbon -->
  <footer class="bottom-nav">
    <div class="ribbon">
      <button class="nav-chip" data-planet="sun">☀️ Sun</button>
      <button class="nav-chip" data-planet="mercury">Mercury</button>
      <button class="nav-chip" data-planet="venus">Venus</button>
      <button class="nav-chip" data-planet="earth">Earth</button>
      <button class="nav-chip" data-planet="moon">Moon</button>
      <button class="nav-chip" data-planet="mars">Mars</button>
      <button class="nav-chip" data-planet="jupiter">Jupiter</button>
      <button class="nav-chip" data-planet="saturn">Saturn</button>
      <button class="nav-chip" data-planet="uranus">Uranus</button>
      <button class="nav-chip" data-planet="neptune">Neptune</button>
      <button class="nav-chip" data-planet="pluto">Pluto</button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
